name: Publish to Telegram Channel (Python Queue)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Publish post to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          python3 - << 'EOF'
          import os
          import urllib.request
          import json
          import urllib.error
          import uuid

          token = os.environ["TELEGRAM_TOKEN"]
          chat_id = os.environ["TELEGRAM_TO"]

          if not os.path.exists("posts.txt"):
              print("ERROR: posts.txt is missing!")
              exit(1)

          with open("posts.txt", "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f.readlines()]

          found_post = False
          first_line = ""
          caption = ""
          image_path = "temp_image.jpg"

          # Ищем первый рабочий пост (пропускаем битые ссылки с 404)
          while lines:
              candidate = lines.pop(0)
              if not candidate or "|" not in candidate:
                  continue
              
              p_url, p_cap = candidate.split("|", 1)
              print(f"Trying image from {p_url}...")
              
              try:
                  req_img = urllib.request.Request(p_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req_img) as response, open(image_path, 'wb') as out_file:
                      out_file.write(response.read())
                  # Если скачалось успешно — фиксируем успех
                  first_line = candidate
                  caption = p_cap.replace("\\n", "\n")
                  found_post = True
                  break
              except urllib.error.HTTPError as e:
                  print(f"WARNING: Image link returned HTTP Error {e.code}. Skipping to next...")
                  continue
              except Exception as e:
                  print(f"WARNING: Failed to download image: {e}. Skipping to next...")
                  continue

          if not found_post:
              print("ERROR: No valid/working posts found in posts.txt!")
              exit(1)

          print("Publishing photo post via multipart upload...")
          url = f"https://api.telegram.org/bot{token}/sendPhoto"
          
          boundary = uuid.uuid4().hex
          fields = {
              "chat_id": chat_id,
              "caption": caption,
              "parse_mode": "Markdown"
          }
          
          with open(image_path, "rb") as f:
              img_bytes = f.read()

          body = bytearray()
          for key, value in fields.items():
              body.extend(f'--{boundary}\r\n'.encode('utf-8'))
              body.extend(f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode('utf-8'))
              body.extend(f'{value}\r\n'.encode('utf-8'))

          body.extend(f'--{boundary}\r\n'.encode('utf-8'))
          body.extend(f'Content-Disposition: form-data; name="photo"; filename="image.jpg"\r\n'.encode('utf-8'))
          body.extend(f'Content-Type: image/jpeg\r\n\r\n'.encode('utf-8'))
          body.extend(img_bytes)
          body.extend(b'\r\n')
          body.extend(f'--{boundary}--\r\n'.encode('utf-8'))

          headers = {
              "Content-Type": f"multipart/form-data; boundary={boundary}"
          }

          req = urllib.request.Request(url, data=bytes(body), headers=headers)

          try:
              with urllib.request.urlopen(req) as response:
                  res_body = json.loads(response.read().decode("utf-8"))
                  print("Telegram Response:", res_body)
                  if not res_body.get("ok"):
                      print("ERROR: Telegram API returned false!")
                      exit(1)
          except urllib.error.HTTPError as e:
              print(f"HTTP Error Details: {e.read().decode('utf-8')}")
              exit(1)
          except Exception as e:
              print(f"ERROR: Failed to send request: {e}")
              exit(1)

          # Сохраняем оставшиеся строки (опубликованный пост удален из очереди)
          with open("posts.txt", "w", encoding="utf-8") as f:
              for line in lines:
                  f.write(line + "\n")

          print("Successfully sent and queue updated!")
          EOF

      - name: Commit changes to queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.txt
          git commit -m "Auto: remove published post and clean broken links" || echo "No changes to commit"
          git push
