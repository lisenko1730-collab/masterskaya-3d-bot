name: Publish to Telegram Channel (Python Queue)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Publish post to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          python3 - << 'EOF'
          import os
          import urllib.request
          import json
          import urllib.error
          import uuid
          import sys

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_TO")

          if not token or not chat_id:
              print("ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_TO is not set!")
              sys.exit(1)

          # Если файла нет или он пустой — создадим запасной набор постов автоматически
          default_posts = [
              "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=1000|💻 *Рабочее место разработчика*\n\nПравильная организация рабочего пространства помогает сосредоточиться на важных задачах.\n\nА как организовано ваше рабочее место?",
              "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=1000|🚀 *Движение вперед*\n\nКаждый день — это новая возможность улучшить свои навыки и создать что-то уникальное.\n\nКаких целей вы хотите достичь на этой неделе?",
              "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000|🛠️ *Технологии и код*\n\nАвтоматизация рутинных процессов позволяет высвободить время для творчества и архитектуры проектов.\n\nЧто бы вы хотели автоматизировать в первую очередь?"
          ]

          if not os.path.exists("posts.txt"):
              print("posts.txt not found, creating with default posts...")
              with open("posts.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(default_posts) + "\n")

          with open("posts.txt", "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f.readlines() if line.strip()]

          # Если файл оказался пустым внутри — наполним его заново
          if not lines:
              print("posts.txt was empty, repopulating with default queue...")
              lines = default_posts.copy()

          found_post = False
          caption = ""
          image_path = "temp_image.jpg"

          # Ищем первый рабочий пост, попутно отсеивая битые ссылки
          while lines:
              candidate = lines.pop(0)
              if "|" not in candidate:
                  print(f"WARNING: Invalid line format, skipping: {candidate}")
                  continue
              
              p_url, p_cap = candidate.split("|", 1)
              print(f"Trying image from: {p_url}")
              
              try:
                  req_img = urllib.request.Request(p_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req_img, timeout=15) as response, open(image_path, 'wb') as out_file:
                      out_file.write(response.read())
                  
                  caption = p_cap.replace("\\n", "\n")
                  found_post = True
                  break
              except Exception as e:
                  print(f"WARNING: Failed to download image due to {e}. Removing from queue and trying next...")
                  continue

          if not found_post:
              print("ERROR: All posts failed! Restoring default queue...")
              lines = default_posts.copy()
              # Попробуем взять первый дефолтный
              candidate = lines.pop(0)
              p_url, p_cap = candidate.split("|", 1)
              req_img = urllib.request.Request(p_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_img, timeout=15) as response, open(image_path, 'wb') as out_file:
                  out_file.write(response.read())
              caption = p_cap.replace("\\n", "\n")

          print("Preparing request for Telegram...")
          url = f"https://api.telegram.org/bot{token}/sendPhoto"
          
          boundary = uuid.uuid4().hex
          fields = {
              "chat_id": chat_id,
              "caption": caption,
              "parse_mode": "Markdown"
          }
          
          with open(image_path, "rb") as f:
              img_bytes = f.read()

          body = bytearray()
          for key, value in fields.items():
              body.extend(f'--{boundary}\r\n'.encode('utf-8'))
              body.extend(f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode('utf-8'))
              body.extend(f'{value}\r\n'.encode('utf-8'))

          body.extend(f'--{boundary}\r\n'.encode('utf-8'))
          body.extend(f'Content-Disposition: form-data; name="photo"; filename="image.jpg"\r\n'.encode('utf-8'))
          body.extend(f'Content-Type: image/jpeg\r\n\r\n'.encode('utf-8'))
          body.extend(img_bytes)
          body.extend(b'\r\n')
          body.extend(f'--{boundary}--\r\n'.encode('utf-8'))

          headers = {
              "Content-Type": f"multipart/form-data; boundary={boundary}"
          }

          req = urllib.request.Request(url, data=bytes(body), headers=headers)

          with urllib.request.urlopen(req, timeout=15) as response:
              res_body = json.loads(response.read().decode("utf-8"))
              print("Telegram Response:", res_body)
              if not res_body.get("ok"):
                  print("ERROR: Telegram API rejected the post!")
                  sys.exit(1)

          # Перезаписываем файл очереди
          with open("posts.txt", "w", encoding="utf-8") as f:
              for line in lines:
                  f.write(line + "\n")

          print("Successfully sent post and updated queue!")
          EOF

      - name: Commit changes to queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.txt
          git commit -m "Auto: remove published post and update queue" || echo "No changes to commit"
          git push
