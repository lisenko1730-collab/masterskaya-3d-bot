name: Publish to Telegram Channel (Text+Photo only)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          # Массив постов: ТОЛЬКО Картинка и Текст. Ссылки удалены.
          POSTS=(
            "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000|🔥 Модульный органайзер для рабочего стола (PLA/PETG). Отличный вариант для наведения порядка в мастерской. Запускаем в печать?"
            "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=1000|🚀 Гибкий защитный чехол для смартфона (TPU). Практичный инженерный проект для тестирования печати мягким пластиком."
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|⚙️ Прочная силовая шестеренка (PETG). Важный элемент для механизмов и нагруженных узлов. Печатаем сразу из PETG для долговечности."
            "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1000|🛠 Универсальная заглушка для карниза и датчика (PLA/PETG). Мелочь, а экономит кучу времени при обустройстве умного дома."
            "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=1000|🌿 Стильное эко-кашпо (PLA). Отличный вариант декора со сложными гранями. Пробуем эко-стиль?"
            "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000|🛡 Виброизоляционные демпферы под ножки принтера (TPU). Полезный апгрейд для снижения шума и вибрации."
            "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1000|🧴 Сменная крышка-дозатор для диспенсера Sagrotan (PETG/PLA). Полезная бытовая мелочь для кухни или ванной."
            "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1000|🏢 Архитектурные панели и макетные элементы (PLA). Элементы для создания декоративных перегородок или архитектурных макетов."
            "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1000|🚗 Автомобильный крючок-клипса для сумок (PETG). Простой и удобный аксессуар в салон авто. Кому из водителей актуально?"
            "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1000|🌱 Настенный эргономичный держатель для роутера (PLA/PETG). Способ аккуратно разместить технику и спрятать провода."
            "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1000|🍳 Подставка для крышек от кастрюль (PETG). Удобный организатор для кухонного пространства."
            "https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=1000|🐾 Двойная приподнятая миска для домашних животных (PLA). Забота о комфорте питомцев."
            "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=1000|🎁 Брендированная настольная подставка для визиток (PLA/PETG). Хороший вариант сувенира или корпоративного подарка."
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|⚡ Угловые мебельные крепежи повышенной прочности (PETG). Надежная фурнитура для самостоятельной сборки мебели."
            "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000|💪 Бизнес-фокус: От хобби к цеху. Как нашей тройке превратить разовые заказы в поток серийного производства?"
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|🎯 Инженерный рост: Каждая неудачная печать — это калибровка опыта. Какой сложный узел победим на этой неделе?"
          )

          # Честный случайный выбор
          TOTAL_POSTS=${#POSTS[@]}
          RANDOM_INDEX=$(( $(od -An -N2 -i /dev/urandom) % TOTAL_POSTS ))
          
          # Разделяем выбранную строку на картинку и текст
          SELECTED="${POSTS[$RANDOM_INDEX]}"
          PHOTO_URL="${SELECTED%%|*}"
          CAPTION="${SELECTED#*|}"

          echo "Selected post index: $RANDOM_INDEX"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION")

          echo "Telegram Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent to Telegram!"
          else
            echo "ERROR: Failed to send to Telegram!"
            exit 1
          fi
