name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"

          # Выбираем случайный вариант текста от 1 до 4
          TEXT_CHOICE=$(( (RANDOM % 4) + 1 ))

          case $TEXT_CHOICE in
            1)
              CAPTION="✨ *Вдохновение для новых проектов\!*

          Путь создания чего-то уникального начинается с идеи, но питается деталями вокруг нас. Каждая линия, каждый кадр и каждый поворот задают вектор для будущих 3D-моделей. 

          💡 *А что вдохновляет вас на творчество сегодня? Делитесь в комментариях\!*"
              ;;
            2)
              CAPTION="📐 *Геометрия и точность в каждой детали\.*

          Иногда идеальная форма рождается из неожиданных сочетаний. Превращаем абстрактные мысли в осязаемые объемы и сложные конструкции.

          💬 *Как вы считаете, что важнее в проекте: строгий расчет или полет фантазии?*"
              ;;
            3)
              CAPTION="🚀 *Технологии воплощения мечты\!*

          Каждый рабочий день — это шаг к созданию чего-то принципиально нового. Экспериментируем с формами, текстурами и объемами.

          🔥 *А какие амбициозные задачи вы планируете решить на этой неделе?*"
              ;;
            4)
              CAPTION="🛠 *Мастерство созидания\.*

          Создание трехмерных объектов — это не просто настройка параметров, это настоящее ремесло, требующее терпения и внимания к мелочам.

          👇 *Расскажите в комментариях, над каким проектом работаете прямо сейчас\!*"
              ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION"
