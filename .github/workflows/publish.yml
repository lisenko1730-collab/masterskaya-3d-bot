name: Publish post

on:
  schedule:
    # Время в UTC. Местное время (UTC+7) = UTC + 7 часов.
    # Каждый час: с 02:00 до 15:00 UTC = с 9:00 до 22:00 по местному времени
    - cron: '0 2-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Publish post
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO || vars.TELEGRAM_TO }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python publish.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update state" && git push)
