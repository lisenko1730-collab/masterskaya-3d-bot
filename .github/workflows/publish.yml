name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"

          # Выбираем случайный вариант тренда от 1 до 15
          TREND_CHOICE=$(( (RANDOM % 15) + 1 ))

          case $TREND_CHOICE in
            1)
              CAPTION="🔥 *Тренд: Функциональный минимализм и органайзеры*

Модульные системы хранения и кастомные подставки под гаджеты. Люди готовы платить за порядок на рабочем столе.

🔗 *Идеи:* [Printables](https://www.printables.com/)
💡 *Обсудим втроем: запустим партию органайзеров?*"
              ;;
            2)
              CAPTION="🚀 *Инженерный спрос: Изделия из гибких пластиков (TPU)*

Функциональные детали, чехлы, демпферы и прокладки. Ниша с высокой маржинальностью.

🔗 *База чертежей:* [Thingiverse](https://www.thingiverse.com/)
👇 *Какое оборудование лучше подойдет под стабильный TPU?*"
              ;;
            3)
              CAPTION="🎨 *Хобби-ниша: Настольные игры и миниатюры*

Кастомные фигурки, элементы террейна и аксессуары для настолок держат топ по скачиваниям.

🔗 *Коллекции:* [MakerWorld](https://makerworld.com/)
✨ *Протестируем печать сложных миниатюр?*"
              ;;
            4)
              CAPTION="⚙️ *Практичные решения: Ремонт и замена деталей*

Печать бытовой фурнитуры, редких шестеренок и ручек, которые не найти в магазинах.

🔗 *Гайды:* [Habr](https://habr.com/ru/hubs/3d_printing/)
💬 *Какой самый необычный ремонтный заказ у вас был?*"
              ;;
            5)
              CAPTION="🛠 *Промышленные материалы: Карбоновые композиты (PA-CF / PET-CF)*

Сверхпрочные конструкционные детали, кронштейны и силовые элементы взамен металла.

🔗 *Обзоры пластика:* [Habr 3D Print](https://habr.com/ru/hubs/3d_printing/)
🔥 *Есть ли смысл брать термокамеру ради таких пластиков?*"
              ;;
            6)
              CAPTION="🌿 *Эко-стиль и декор: Деревянные и композитные филаменты (Wood-fill)*

Изделия с текстурой натурального дерева для интерьера, кашпо и дизайнерских панелей.

🔗 *Модели для декора:* [Printables](https://www.printables.com/)
💬 *Как часто клиенты просят «под дерево»?*"
              ;;
            7)
              CAPTION="🛡 *Косплей и гик-культура: Элементы костюмов и реквизит*

Шлемы, броня, бутафория и реплики оружия для фестивалей и коллекционеров. Высокий чек на постобработку.

🔗 *Примеры:* [Thingiverse](https://www.thingiverse.com/)
✨ *Кто готов заняться шпатлевкой и покраской такого шлема?*"
              ;;
            8)
              CAPTION="💡 *Интерьерный свет: Литофаны и кастомные светильники*

Объемные фотографии-литофаны и дизайнерские абажуры с рассеянным светом. Отличный подарок под заказ.

🔗 *Генераторы литофанов:* [Printables](https://www.printables.com/)
💡 *Делаем сувенирную линейку светильников?*"
              ;;
            9)
              CAPTION="🏢 *Архитектура: Градостроительные и ландшафтные макеты*

Точные макеты зданий, коттеджных поселков и рельефов местности для застройщиков.

🔗 *Сообщество:* [MakerWorld](https://makerworld.com/)
📈 *Пытались ли мы выходить на строительные компании?*"
              ;;
            10)
              CAPTION="🚗 *Автотюнинг: Редкие клипсы, заглушки и элементы салона*

Мелкий автопластик, крепления проводки, органайзеры в багажник и редкие автодетали.

🔗 *Авто-модели:* [Thingiverse](https://www.thingiverse.com/)
👇 *Кому из автолюбителей актуально?*"
              ;;
            11)
              CAPTION="🌱 *Умное цветоводство: Кашпо с автополивом и сложной геометрией*

Дизайнерские горшки для растений со встроенными системами дренажа и необычным узором.

🔗 *Идеи кашпо:* [Printables](https://www.printables.com/)
🌿 *Запустим весеннюю серию стильных кашпо?*"
              ;;
            12)
              CAPTION="🍳 *Кухонные гаджеты: Эргономичные держатели и органайзеры*

Кастомные подставки под ножи, дозаторы, сушилки и держатели для крышек под размер кухни клиента.

🔗 *Каталог:* [MakerWorld](https://makerworld.com/)
💬 *Какую кухонную проблему решит 3D-печать?*"
              ;;
            13)
              CAPTION="🔧 *Мастерская: Системы хранения на перфопанелях (Pegboard)*

Крючки, лотки и держатели под конкретный инструмент. Идеальный порядок на рабочем месте.

🔗 *Системы хранения:* [Printables](https://www.printables.com/)
⚙️ *Переделываем стеллажи под наши патроны и ключи?*"
              ;;
            14)
              CAPTION="🐾 *Зоотовары: Миски на подставках, игрушки и тренажеры*

Персонализированные миски для животных, когтеточки и интерактивные игрушки.

🔗 *Идеи для питомцев:* [Thingiverse](https://www.thingiverse.com/)
🐶 *У кого дома питомцы протестируют новинки?*"
              ;;
            15)
              CAPTION="🎁 *Персонализированные подарки: Именные таблички и кубки*

Уникальные сувениры с гравировкой, логотипами компаний и памятными надписями.

🔗 *Тренды подарков:* [MakerWorld](https://makerworld.com/)
✨ *Делаем корпоративные сувениры на заказ?*"
              ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION"
