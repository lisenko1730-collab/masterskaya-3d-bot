name: Publish to Telegram Channel

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=🚀 *Запускаем новое направление в нашей мастерской\!*

          Друзья, мы постоянно развиваемся и осваиваем крутые технологичные новинки. Посмотрите на этот результат — гладкая текстура, идеальные линии и абсолютная прочность. 

          🔥 Теперь мы можем воплощать в жизнь еще более сложные и необычные проекты. 

          👇 *Как вам такая работа? Что бы вы хотели напечатать в рамках нашего нового направления? Пишите в комментариях\!*"
