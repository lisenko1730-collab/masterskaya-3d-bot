name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"
          TREND_CHOICE=$(( (RANDOM % 15) + 1 ))

          case $TREND_CHOICE in
            1) CAPTION="🔥 Тренд: Органайзеры. Модульные системы хранения для порядка на столе. [Printables](https://www.printables.com/) | Обсудим: запустим партию?" ;;
            2) CAPTION="🚀 Инженерный спрос: TPU-пластик. Чехлы, демпферы, высокая маржинальность. [Thingiverse](https://www.thingiverse.com/) | Какое оборудование нужно под TPU?" ;;
            3) CAPTION="🎨 Хобби: Миниатюры для настолок. Кастомные фигурки и террейн. [MakerWorld](https://makerworld.com/) | Протестируем печать смолой?" ;;
            4) CAPTION="⚙️ Ремонт: Замена редких деталей и фурнитуры. [Habr](https://habr.com/ru/hubs/3d_printing/) | Какой необычный заказ был у вас?" ;;
            5) CAPTION="🛠 Композиты: PA-CF и углеволокно для прочных деталей взамен металла. [Habr](https://habr.com/ru/hubs/3d_printing/) | Нужна ли термокамера?" ;;
            6) CAPTION="🌿 Эко-декор: Wood-fill с текстурой дерева для интерьера. [Printables](https://www.printables.com/) | Часто ли просят под дерево?" ;;
            7) CAPTION="🛡 Косплей: Шлемы, броня и реквизит с высокой стоимостью обработки. [Thingiverse](https://www.thingiverse.com/) | Кто готов красить реплики?" ;;
            8) CAPTION="💡 Светильники: Литофаны и объемные фото-абажуры под заказ. [Printables](https://www.printables.com/) | Делаем линейку светильников?" ;;
            9) CAPTION="🏢 Архитектура: Макеты зданий и рельефов для застройщиков. [MakerWorld](https://makerworld.com/) | Выходили ли мы на строителей?" ;;
            10) CAPTION="🚗 Автотюнинг: Клипсы, заглушки и элементы салона. [Thingiverse](https://www.thingiverse.com/) | Кому актуально из автолюбителей?" ;;
            11) CAPTION="🌱 Кашпо: Горшки для цветов с автополивом и сложной геометрией. [Printables](https://www.printables.com/) | Запустим серию кашпо?" ;;
            12) CAPTION="🍳 Кухня: Эргономичные держатели и органайзеры под размер. [MakerWorld](https://makerworld.com/) | Какую проблему решит печать?" ;;
            13) CAPTION="🔧 Мастерская: Системы хранения на перфопанелях. [Printables](https://www.printables.com/) | Переделываем стеллажи под ключи?" ;;
            14) CAPTION="🐾 Зоотовары: Миски на подставках и игрушки для питомцев. [Thingiverse](https://www.thingiverse.com/) | У кого питомцы протестируют новинку?" ;;
            15) CAPTION="🎁 Подарки: Именные таблички, кубки и корпоративные сувениры. [MakerWorld](https://makerworld.com/) | Делаем сувениры на заказ?" ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION"
