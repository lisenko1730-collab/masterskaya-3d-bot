name: Publish to Telegram Channel

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=✨ *Вдохновение для новых проектов\!*

          Путь создания чего-то уникального начинается с идеи, но питается деталями вокруг нас. Каждая линия, каждый кадр и каждый поворот задают вектор для будущих 3D-моделей. 

          💡 *А что вдохновляет вас на творчество сегодня? Делитесь в комментариях\!*"
