name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"
          TREND_CHOICE=$(( (RANDOM % 15) + 1 ))

          case $TREND_CHOICE in
            1) CAPTION="🔥 Тренд (PLA/PETG): Модульный органайзер для стола. [Открыть модель](https://www.printables.com/model/525695-ultimate-drawer-organizer) | Запускаем в печать?" ;;
            2) CAPTION="🚀 Инженерка (TPU): Прочный чехол-бампер для телефона. [Открыть модель](https://www.thingiverse.com/thing:5188122) | Какая скорость под наш TPU?" ;;
            3) CAPTION="⚙️ PETG: Силовая шестерня для механизма. [Открыть модель](https://www.printables.com/model/188452-strong-spur-gear) | Печатаем сразу из PETG?" ;;
            4) CAPTION="🛠 Инженерка (PLA/PETG): Заглушка для карниза и крепление датчика. [Открыть модель](https://www.printables.com/model/298412) | Полезная фурнитура для дома?" ;;
            5) CAPTION="🌿 Эко-декор (PLA): Стильное кашпо со сложными гранями. [Открыть модель](https://www.thingiverse.com/thing:2714481) | Пробуем эко-стиль?" ;;
            6) CAPTION="🛡 TPU: Виброизоляционные демпферы под ножки принтера. [Открыть модель](https://www.thingiverse.com/thing:3249102) | Тестируем усадку на мягком?" ;;
            7) CAPTION="💡 PLA: Геометрический подвесной абажур. [Открыть модель](https://www.printables.com/model/284102-geometric-lampshade) | Делаем линейку светильников?" ;;
            8) CAPTION="🏢 PLA: Архитектурный макет панели здания. [Открыть модель](https://www.printables.com/model/394102-architectural-panel) | Есть выходы на архитекторов?" ;;
            9) CAPTION="🚗 PETG: Автомобильный крючок-клипса в салон. [Открыть модель](https://www.thingiverse.com/thing:3948192) | Кому из водителей актуально?" ;;
            10) CAPTION="🌱 PLA/PETG: Настенный держатель под роутер. [Открыть модель](https://www.printables.com/model/123984-wall-mount-router-holder) | Запустим серию?" ;;
            11) CAPTION="🍳 PETG: Эргономичная подставка под крышки кастрюль. [Открыть модель](https://www.printables.com/model/198273-pot-lid-holder) | Какую проблему кухни решим?" ;;
            12) CAPTION="🔧 PETG: Держатель под инструмент для перфопанели. [Открыть модель](https://www.printables.com/model/502819-pegboard-pliers-holder) | Переделываем стеллажи?" ;;
            13) CAPTION="🐾 PLA: Двойная подставка под миски животных. [Открыть модель](https://www.thingiverse.com/thing:2847192) | У кого питомцы протестируют?" ;;
            14) CAPTION="🎁 PLA/PETG: Брендированная визитница на стол. [Открыть модель](https://www.printables.com/model/319402-business-card-holder) | Делаем под заказ?" ;;
            15) CAPTION="⚡️ PETG: Угловые мебельные крепежи высокой прочности. [Открыть модель](https://www.printables.com/model/419203-heavy-duty-corner-bracket) | Насколько востребовано?" ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION"
