name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"
          TREND_CHOICE=$(( (RANDOM % 15) + 1 ))

          case $TREND_CHOICE in
            1) CAPTION="🔥 Тренд (PLA/PETG): Модульный органайзер для рабочего стола. Отличная эргономика и быстрый спрос. [Смотреть модель](https://www.printables.com/model/525695-ultimate-drawer-organizer) | Обсудим: запускаем в печать?" ;;
            2) CAPTION="🚀 Инженерный спрос (TPU): Прочный чехол-бампер. Высокая эластичность и износостойкость. [Смотреть модель](https://www.thingiverse.com/thing:5188122) | Какая скорость печати лучше под наш TPU?" ;;
            3) CAPTION="⚙️ Практичный PETG: Реплика силовой шестеренки и механического узла. Высокая прочность. [Смотреть модель](https://makerworld.com/en/models/38202) | Печатаем сразу из PETG?" ;;
            4) CAPTION="🛠 Инженерка (PETG/PLA): Корпус под электронику и платы с пассивным охлаждением. [Читать кейс](https://habr.com/ru/hubs/3d_printing/) | Какой заполнитель даем для жесткости?" ;;
            5) CAPTION="🌿 Эко-декор (PLA): Дизайнерское кашпо со сложной геометрией. [Смотреть модель](https://www.printables.com/model/451234-low-poly-planter) | Часто ли просят эко-стиль?" ;;
            6) CAPTION="🛡 Функционал (TPU): Демпферы вибрации и гибкие прокладки под оборудование. [Смотреть модель](https://www.thingiverse.com/thing:4829103) | Кто тестировал усадку на мягком пластике?" ;;
            7) CAPTION="💡 Интерьер (PLA): Геометрический абажур для подвесного светильника. [Смотреть модель](https://www.printables.com/model/284102-lithophane-lamp) | Делаем линейку светильников?" ;;
            8) CAPTION="🏢 Макеты (PLA): Архитектурные элементы и панели для макетирования. [Смотреть модель](https://makerworld.com/en/models/15201) | Есть ли выходы на архитекторов?" ;;
            9) CAPTION="🚗 Автотюнинг (PETG): Клипса-держатель и заглушка в салон, стойкая к жаре. [Смотреть модель](https://www.thingiverse.com/thing:3948192) | Кому из автомобилистов актуально?" ;;
            10) CAPTION="🌱 Умный дом (PLA/PETG): Настенный держатель под роутер и умные колонки. [Смотреть модель](https://www.printables.com/model/123984-self-watering-planter) | Запустим серию держателей?" ;;
            11) CAPTION="🍳 Кухня (PETG): Эргономичная сушилка и настенный органайзер для крышек. [Смотреть модель](https://makerworld.com/en/models/84920) | Какую кухонную проблему решим?" ;;
            12) CAPTION="🔧 Мастерская (PETG): Кастомный лоток под ключи и расходники для перфопанели. [Смотреть модель](https://www.printables.com/model/198273-pegboard-tool-holder) | Переделываем стеллажи под себя?" ;;
            13) CAPTION="🐾 Зоотовары (PLA): Прочная двойная миска для животных на подставке. [Смотреть модель](https://www.thingiverse.com/thing:2847192) | У кого питомцы протестируют новинку?" ;;
            14) CAPTION="🎁 Корпоративное (PLA/PETG): Брендированная подставка под визитки и гаджеты. [Смотреть модель](https://makerworld.com/en/models/49102) | Делаем сувениры на заказ?" ;;
            15) CAPTION="⚡️ Фурнитура (PETG): Специализированные крепежи и уголки для сборки мебели. [Смотреть модель](https://www.printables.com/model/525695-ultimate-drawer-organizer) | Насколько это востребовано?" ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION"
