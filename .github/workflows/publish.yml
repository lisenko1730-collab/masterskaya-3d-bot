name: Publish to Telegram Channel (Python Queue)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Publish post to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          python3 - << 'EOF'
          import os
          import urllib.request
          import json
          import urllib.error
          import uuid

          token = os.environ["TELEGRAM_TOKEN"]
          chat_id = os.environ["TELEGRAM_TO"]

          if not os.path.exists("posts.txt"):
              print("ERROR: posts.txt is missing!")
              exit(1)

          with open("posts.txt", "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f.readlines()]

          valid_idx = -1
          first_line = ""
          for i, line in enumerate(lines):
              if line and "|" in line:
                  valid_idx = i
                  first_line = line
                  break

          if valid_idx == -1:
              print("ERROR: No valid posts found in posts.txt!")
              exit(1)

          photo_url, caption = first_line.split("|", 1)
          caption = caption.replace("\\n", "\n")

          print(f"Downloading image from {photo_url}...")
          image_path = "temp_image.jpg"
          try:
              req_img = urllib.request.Request(photo_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_img) as response, open(image_path, 'wb') as out_file:
                  out_file.write(response.read())
          except Exception as e:
              print(f"ERROR: Failed to download image: {e}")
              exit(1)

          print("Publishing photo post via multipart upload...")
          url = f"https://api.telegram.org/bot{token}/sendPhoto"
          
          boundary = uuid.uuid4().hex
          fields = {
              "chat_id": chat_id,
              "caption": caption,
              "parse_mode": "Markdown"
          }
          
          with open(image_path, "rb") as f:
              img_bytes = f.read()

          body = bytearray()
          for key, value in fields.items():
              body.extend(f'--{boundary}\r\n'.encode('utf-8'))
              body.extend(f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode('utf-8'))
              body.extend(f'{value}\r\n'.encode('utf-8'))

          body.extend(f'--{boundary}\r\n'.encode('utf-8'))
          body.extend(f'Content-Disposition: form-data; name="photo"; filename="image.jpg"\r\n'.encode('utf-8'))
          body.extend(f'Content-Type: image/jpeg\r\n\r\n'.encode('utf-8'))
          body.extend(img_bytes)
          body.extend(b'\r\n')
          body.extend(f'--{boundary}--\r\n'.encode('utf-8'))

          headers = {
              "Content-Type": f"multipart/form-data; boundary={boundary}"
          }

          req = urllib.request.Request(url, data=bytes(body), headers=headers)

          try:
              with urllib.request.urlopen(req) as response:
                  res_body = json.loads(response.read().decode("utf-8"))
                  print("Telegram Response:", res_body)
                  if not res_body.get("ok"):
                      print("ERROR: Telegram API returned false!")
                      exit(1)
          except urllib.error.HTTPError as e:
              print(f"HTTP Error Details: {e.read().decode('utf-8')}")
              exit(1)
          except Exception as e:
              print(f"ERROR: Failed to send request: {e}")
              exit(1)

          remaining_lines = lines[valid_idx + 1:]
          with open("posts.txt", "w", encoding="utf-8") as f:
              for line in remaining_lines:
                  f.write(line + "\n")

          print("Successfully sent and queue updated!")
          EOF

      - name: Commit changes to queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.txt
          git commit -m "Auto: remove published post from queue" || echo "No changes to commit"
          git push
