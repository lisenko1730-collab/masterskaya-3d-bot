name: Publish to Telegram Channel (File Queue)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Обязательно, чтобы скрипт мог сам удалять отправленный пост из файла и делать коммит
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          if [ ! -f "posts.txt" ] || [ ! -s "posts.txt" ]; then
            echo "ERROR: posts.txt is missing or empty!"
            exit 1
          fi

          FIRST_LINE=$(head -n 1 posts.txt)
          PHOTO_URL="${FIRST_LINE%%|*}"
          CAPTION="${FIRST_LINE#*|}"

          echo "Publishing post..."

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION")

          echo "Telegram Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent to Telegram!"
            
            # Удаляем первую строку из файла, чтобы она больше не повторялась
            sed -i '1d' posts.txt
            
            # Сохраняем изменения обратно в репозиторий
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add posts.txt
            git commit -m "Auto: remove published post from queue"
            git push
          else
            echo "ERROR: Failed to send to Telegram!"
            exit 1
          fi
