name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          RANDOM_ID=$((RANDOM % 1000))
          PHOTO_URL="https://picsum.photos/seed/${RANDOM_ID}/1000/1000"

          # Выбираем случайный вариант тренда от 1 до 4
          TREND_CHOICE=$(( (RANDOM % 4) + 1 ))

          case $TREND_CHOICE in
            1)
              CAPTION="🔥 *Тренд рынка: Функциональный минимализм и органайзеры*

          Сейчас огромным спросом пользуются модульные системы хранения и кастомные подставки под гаджеты для рабочего стола. Люди готовы платить за удобство и порядок.

          🔗 *Примеры и популярные модели:* [Смотреть на Printables](https://www.printables.com/)
          
          💡 *Обсудим втроем: стоит ли запустить в печать партию таких органайзеров?*"
              ;;
            2)
              CAPTION="🚀 *Инженерный спрос: Изделия из гибких пластиков (TPU)*

          Растет популярность функциональных деталей, чехлов, демпферов и прокладок, напечатанных мягкими филаментами. Это ниша с высокой маржинальностью.

          🔗 *База идей и чертежей:* [Изучить на Thingiverse](https://www.thingiverse.com/)
          
          👇 *Как думаете, какое оборудование лучше подойдет под стабильную печать TPU?*"
              ;;
            3)
              CAPTION="🎨 *Хобби-ниша: Настольные игры и детализированные миниатюры*

          Кастомные фигурки, элементы террейна и кастомизация для настолок держат стабильный топ по скачиваниям и заказам среди энтузиастов.

          🔗 *Трендовые коллекции:* [Смотреть на MakerWorld](https://makerworld.com/)
          
          ✨ *Стоит ли нам попробовать протестировать печать сложных смоляных миниатюр?*"
              ;;
            4)
              CAPTION="⚙️ *Практичные решения: Быстрый ремонт и замена редких деталей*

          Печать бытовой фурнитуры, редких шестеренок, ручек и креплений, которые сложно найти в магазинах. Самый быстрый путь к частным заказам «под ключ».

          🔗 *Полезные кейсы и гайды:* [Читать статьи на Habr](https://habr.com/ru/hubs/3d_printing/)
          
          💬 *Какой самый необычный заказ на ремонт детали у вас был?*"
              ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION"
