name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          # Массив постов: каждая строка содержит четкую пару "Картинка|Текст с правильной ссылкой"
          POSTS=(
            "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000|🔥 Тренд (PLA/PETG): Модульный органайзер для рабочего стола. [Открыть модель](https://www.printables.com/model/525695-ultimate-drawer-organizer) | Запускаем в печать?"
            "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=1000|🚀 Инженерка (TPU): Гибкий и прочный защитный чехол. [Открыть модель](https://www.printables.com/model/481203-tpu-phone-bumper-case) | Какая скорость печати под наш TPU?"
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|⚙️ PETG: Прочная силовая шестеренка для механизма. [Открыть модель](https://www.printables.com/model/188452-strong-spur-gear) | Печатаем сразу из PETG?"
            "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1000|🛠 Инженерка (PLA/PETG): Заглушка для карниза и датчика умного дома. [Открыть модель](https://www.printables.com/model/298412-curtain-rail-plug-and-sensor-mount) | Полезная фурнитура?"
            "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=1000|🌿 Эко-декор (PLA): Стильное кашпо со сложными гранями. [Открыть модель](https://www.printables.com/model/63972-low-poly-planter) | Пробуем эко-стиль?"
            "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000|🛡 TPU: Виброизоляционные демпферы под ножки принтера. [Открыть модель](https://www.printables.com/model/119934-anti-vibration-feet-for-prusa-i3-mk3s-mini-and-oth) | Тестируем усадку на мягком?"
            "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=1000|🧴 PETG/PLA: Сменная крышка-дозатор для диспенсера Sagrotan. [Открыть модель](https://www.printables.com/model/131920-soap-dispenser-pump) | Полезная бытовая мелочь?"
            "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1000|🏢 PLA: Архитектурные панели и макетные элементы. [Открыть модель](https://www.printables.com/model/77245-parametric-voronoi-coaster-or-wall-art) | Есть выходы на архитекторов?"
            "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1000|🚗 PETG: Автомобильный крючок-клипса для сумок в салон. [Открыть модель](https://www.printables.com/model/152841-car-headrest-hook-universal) | Кому из водителей актуально?"
            "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1000|🌱 PLA/PETG: Настенный эргономичный держатель для роутера. [Открыть модель](https://www.printables.com/model/284102-universal-router-wall-mount) | Запустим серию?"
            "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1000|🍳 PETG: Подставка и организатор под крышки для кастрюль. [Открыть модель](https://www.printables.com/model/98124-pot-lid-holder-organizer) | Какую проблему кухни решим?"
            "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=1000|🔧 PETG: Держатель под инструмент для перфопанели. [Открыть модель](https://www.printables.com/model/49102-pegboard-tool-holder-system) | Переделываем стеллажи?"
            "https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=1000|🐾 PLA: Двойная приподнятая миска для домашних животных. [Открыть модель](https://www.printables.com/model/162934-elevated-pet-bowl-stand) | У кого питомцы протестируют?"
            "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=1000|🎁 PLA/PETG: Брендированная настольная подставка для визиток. [Открыть модель](https://www.printables.com/model/89204-modern-business-card-holder) | Делаем под заказ?"
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|⚡ PETG: Угловые мебельные крепежи повышенной прочности. [Открыть модель](https://www.printables.com/model/120491-heavy-duty-corner-bracket) | Насколько востребовано?"
            "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1000|💪 Бизнес-фокус: От хобби к цеху. Как нашей тройке превратить разовые заказы в поток серийного производства? Обсуждаем стратегию масштабирования!"
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|🎯 Инженерный рост: Каждая неудачная печать и отлипший слой — это не брак, а калибровка опыта. Какой сложный узел победим на этой неделе?"
            "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1000|🤝 Синергия команды: Один моделирует, второй настраивает термопрофиль, третий закрывает сбыт. Как распределим задачи для следующего крупного проекта?"
          )

          # Честно выбираем случайный индекс с помощью /dev/urandom
          TOTAL_POSTS=${#POSTS[@]}
          RANDOM_INDEX=$(( $(od -An -N2 -i /dev/urandom) % TOTAL_POSTS ))
          
          # Достаем выбранную строку и разделяем на картинку и текст
          SELECTED="${POSTS[$RANDOM_INDEX]}"
          PHOTO_URL="${SELECTED%%|*}"
          CAPTION="${SELECTED#*|}"

          echo "Selected post index: $RANDOM_INDEX"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION")

          echo "Telegram Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent to Telegram!"
          else
            echo "ERROR: Failed to send to Telegram!"
            exit 1
          fi
