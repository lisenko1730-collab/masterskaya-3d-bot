name: Publish to Telegram Channel (Photo + Caption)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo and caption to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          if [ ! -f "posts.txt" ] || [ ! -s "posts.txt" ]; then
            echo "ERROR: posts.txt is missing or empty!"
            exit 1
          fi

          FIRST_LINE=$(head -n 1 posts.txt)
          PHOTO_URL=$(echo "$FIRST_LINE" | cut -d'|' -f1)
          CAPTION=$(echo "$FIRST_LINE" | cut -d'|' -f2-)

          echo "Downloading image from: $PHOTO_URL"
          curl -s -L "$PHOTO_URL" -o temp_image.jpg

          if [ ! -s "temp_image.jpg" ]; then
            echo "ERROR: Failed to download image!"
            exit 1
          fi

          echo "Publishing post with photo..."

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -F "chat_id=$TELEGRAM_TO" \
            -F "photo=@temp_image.jpg" \
            -F "caption=$CAPTION" \
            -F "parse_mode=Markdown")

          echo "Telegram Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent to Telegram!"
            
            # Удаляем первую строку из файла
            sed -i '1d' posts.txt
            
            # Сохраняем изменения в репозиторий
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add posts.txt
            git commit -m "Auto: remove published post from queue"
            git push
          else
            echo "ERROR: Failed to send to Telegram!"
            exit 1
          fi
