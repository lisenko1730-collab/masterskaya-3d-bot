name: Publish to Telegram Channel (Sequential & Clean)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          # Массив уникальных постов: только качественная картинка и живой текст про пользу и удобство
          POSTS=(
            "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000|🔥 **Идеальный порядок на рабочем столе**\n\nЗнакома ситуация, когда нужная мелочь вечно теряется под рукой? Этот модульный органайзер создан для того, чтобы каждая вещь лежала на своем месте. Удобно, красиво и под рукой!\n\nА как вы организуете свое рабочее пространство?"
            "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=1000|🚀 **Надежная защита для вашего смартфона**\n\nПрочный и гибкий чехол, который плотно сидит на телефоне и отлично смягчает удары при падении. Практичное решение на каждый день, которое приятно держать в руке.\n\nКакой стиль чехлов предпочитаете: строгий минимализм или яркие цвета?"
            "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000|⚙️ **Надежные детали для техники**\n\nКогда ломается важный механизм, не обязательно искать редкие запчасти — качественное исполнение решает проблему за один вечер. Прочно, долговечно и точно по размеру.\n\nСталкивались с тем, что из-за одной копеечной детали останавливается вся работа?"
            "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1000|🛠 **Полезные мелочи для дома**\n\nТе самые незаметные помощники, которые делают быт комфортнее: аккуратные заглушки, фиксаторы и держатели. Экономят кучу времени и решают мелкие бытовые задачи.\n\nКакая бытовая мелочь больше всего раздражает своей нехваткой?"
            "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=1000|🌿 **Стильный эко-декор для интерьера**\n\nЭлегантное кашпо со сложными геометрическими гранями отлично дополняет интерьер комнаты или офиса. Живые растения в таком обрамлении смотрятся совсем по-другому.\n\nЛюбите комнатные растения дома?"
            "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=1000|🛡 **Комфорт и тишина в мастерской**\n\nСпециальные подставки под технику, которые гасят лишние вибрации и делают работу тише и приятнее. Забота об удобстве в каждой детали.\n\nА вы обращаете внимание на уровень шума техники дома?"
            "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=1000|🧴 **Удобные аксессуары для ванной и кухни**\n\nСтильный и практичный дозатор, который идеально вписывается в интерьер и делает использование привычных вещей намного удобнее.\n\nЦентите ли вы единый стиль в ванной комнате?"
            "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1000|🚗 **Порядок в автомобиле**\n\nУдобный крючок-клипса для салона: сумки, пакеты и верхняя одежда больше не падают на сиденья при поворотах. Максимум комфорта в дороге.\n\nКому из водителей знакома эта проблема с пакетами на сиденье?"
            "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1000|🌱 **Аккуратное размещение техники**\n\nНастенный держатель для роутера или гаджетов. Никаких свисающих проводов и хаоса на полках — только чистый минимализм и порядок.\n\nКак боретесь с проводами в квартире?"
            "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1000|🍳 **Идеальный порядок на кухне**\n\nУдобная подставка под кухонные крышки и утварь. Всё на своих местах, под рукой и больше не занимает лишнее пространство в шкафах.\n\nЛюбите, когда на кухне идеальный порядок?"
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1000|💡 **Стильное освещение своими руками**\n\nСоздаем уникальные дизайнерские светильники, которые наполняют комнату мягким, уютным светом и привлекают взгляды гостей.\n\nКакой свет в комнате предпочитаете: яркий или приглушенный?"
            "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1000|💪 **От увлечения к собственному делу**\n\nКак превратить интерес к качественным вещам в серьезный проект? Делимся мыслями о развитии, создании команды и стремлении делать по-настоящему классный продукт.\n\nА вы с чего начинали свое любимое дело?"
          )

          TOTAL_POSTS=${#POSTS[@]}
          
          # Строгий последовательный порядок публикаций без случайных повторов
          RUN_NUMBER=${GITHUB_RUN_NUMBER:-1}
          INDEX=$(( (RUN_NUMBER - 1) % TOTAL_POSTS ))

          SELECTED="${POSTS[$INDEX]}"
          PHOTO_URL="${SELECTED%%|*}"
          CAPTION="${SELECTED#*|}"

          echo "Post index: $INDEX of $TOTAL_POSTS"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION")

          echo "Telegram Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent to Telegram!"
          else
            echo "ERROR: Failed to send to Telegram!"
            exit 1
          fi
