name: Publish to Telegram Channel (Index Rotation)

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Publish post to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os
          import urllib.request
          import json
          import uuid
          import sys

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_TO")
          run_number = int(os.environ.get("RUN_NUMBER", 1))

          if not token or not chat_id:
              print("ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_TO is not set!")
              sys.exit(1)

          # Список уникальных постов (без истории, только технологии, эрудиция и мотивация)
          posts = [
              (
                  "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=1000",
                  "📚 Сила эрудиции и междисциплинарный подход\n\n"
                  "Настоящие прорывы в инженерии и дизайне редко рождаются на стыке одной узкой дисциплины. Чаще всего классное решение возникает тогда, когда опыт из совершенно другой сферы неожиданно применяется к текущей задаче.\n\n"
                  "Широкий кругозор учит нас видеть паттерны там, где остальные видят тупик. Чтение книг, изучение науки и смежных технологий — это фундамент, который превращает исполнителя в созидателя.\n\n"
                  "💬 А какая книга или область знаний помогли вам по-новому взглянуть на привычные вещи?"
              ),
              (
                  "https://images.unsplash.com/photo-1517649763962-0c623066013b?w=1000",
                  "⚡ Внутренняя мотивация против мимолетного вдохновения\n\n"
                  "Вдохновение — прекрасная искра, но на нем далеко не уедешь. Когда проект затягивается, а сложные задачи требуют долгих часов концентрации, в дело вступает только система, дисциплина и видение конечной цели.\n\n"
                  "Успех в любом деле строится на маленьких, но регулярных шагах. Даже по 30 минут в день, уделяемые развитию навыка, через год дают колоссальный результат.\n\n"
                  "💬 Что помогает вам сохранять фокус и доводить сложные замыслы до конца?"
              ),
              (
                  "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=1000",
                  "💻 Эргономика и организация рабочего пространства\n\n"
                  "Окружение напрямую влияет на продуктивность. Беспорядок на столе или в цифровых файлах незаметно забирает ресурс внимания, уходящий на преодоление этого хаоса.\n\n"
                  "Продуманное рабочее место, удобный инструмент, чистый код и структурированные задачи экономят часы времени и сохраняют ментальную энергию.\n\n"
                  "💬 Расскажите, без какого элемента в своей мастерской или за компьютером вы не представляете свой день?"
              ),
              (
                  "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000",
                  "🛠️ Автоматизация как философия созидания\n\n"
                  "Рутина убивает творчество. Когда большую часть времени приходится тратить на однотипные действия, на рождение новых идей сил уже не остается.\n\n"
                  "Именно поэтому оптимизация процессов — будь то автоматизация задач через скрипты или организация рабочего пространства — лучший шаг для любого мастера.\n\n"
                  "💬 А какой рутинный процесс вы бы хотели автоматизировать в первую очередь?"
              )
          ]

          # Жестко выбираем пост по кругу на основе номера запуска GitHub Actions
          index = (run_number - 1) % len(posts)
          p_url, caption = posts[index]
          image_path = "temp_image.jpg"

          print(f"Selected post index {index} (Run #{run_number}) with image: {p_url}")

          # Скачиваем картинку с проверкой
          try:
              req_img = urllib.request.Request(p_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_img, timeout=15) as response, open(image_path, 'wb') as out_file:
                  out_file.write(response.read())
          except Exception as e:
              print(f"ERROR: Failed to download image: {e}")
              sys.exit(1)

          print("Preparing request for Telegram...")
          url = f"https://api.telegram.org/bot{token}/sendPhoto"
          
          boundary = uuid.uuid4().hex
          fields = {
              "chat_id": chat_id,
              "caption": caption
          }
          
          with open(image_path, "rb") as f:
              img_bytes = f.read()

          body = bytearray()
          for key, value in fields.items():
              body.extend(f'--{boundary}\r\n'.encode('utf-8'))
              body.extend(f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode('utf-8'))
              body.extend(f'{value}\r\n'.encode('utf-8'))

          body.extend(f'--{boundary}\r\n'.encode('utf-8'))
          body.extend(f'Content-Disposition: form-data; name="photo"; filename="image.jpg"\r\n'.encode('utf-8'))
          body.extend(f'Content-Type: image/jpeg\r\n\r\n'.encode('utf-8'))
          body.extend(img_bytes)
          body.extend(b'\r\n')
          body.extend(f'--{boundary}--\r\n'.encode('utf-8'))

          headers = {
              "Content-Type": f"multipart/form-data; boundary={boundary}"
          }

          req = urllib.request.Request(url, data=bytes(body), headers=headers)

          with urllib.request.urlopen(req, timeout=15) as response:
              res_body = json.loads(response.read().decode("utf-8"))
              print("Telegram Response:", res_body)
              if not res_body.get("ok"):
                  print("ERROR: Telegram API rejected the post!")
                  sys.exit(1)

          print("Successfully sent post!")
          EOF
