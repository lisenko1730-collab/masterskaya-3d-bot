name: Publish post

on:
  schedule:
    # Время в UTC. Местное время (UTC+7) = UTC + 7 часов.
    # Один раз в день в 03:00 UTC = ровно 10:00 утра по местному времени
    - cron: '0 3 * * *'
  workflow_dispatch: # Оставляем для ручного тестирования по кнопке

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Рекомендую добавить эту строку, если у вас включена защита ветки (Branch Protection)
          # token: ${{ secrets.PAT_TOKEN }} 

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Publish post
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO || vars.TELEGRAM_TO }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python publish.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Добавляем pull --rebase на случай, если в репозитории появились другие изменения
          git pull --rebase origin ${{ github.ref_name }}
          git add state.json
          git diff --staged --quiet || (git commit -m "chore: update state.json" && git push)
