name: Publish to Telegram Channel

on:
  schedule:
    - cron: '*/30 2-15 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send photo to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: "@master_3d_workshop"
        run: |
          TREND_CHOICE=$(( (RANDOM % 18) + 1 ))

          case $TREND_CHOICE in
            1) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000"
              CAPTION="🔥 Тренд (PLA/PETG): Модульный органайзер для рабочего стола. [Открыть модель](https://www.printables.com/model/525695-ultimate-drawer-organizer) | Запускаем в печать?" 
              ;;
            2) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=1000"
              CAPTION="🚀 Инженерка (TPU): Гибкий и прочный защитный чехол. [Открыть модель](https://www.printables.com/model/481203-tpu-phone-bumper-case) | Какая скорость печати под наш TPU?" 
              ;;
            3) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000"
              CAPTION="⚙️ PETG: Прочная силовая шестеренка для механизма. [Открыть модель](https://www.printables.com/model/188452-strong-spur-gear) | Печатаем сразу из PETG?" 
              ;;
            4) 
              PHOTO_URL="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1000"
              CAPTION="🛠 Инженерка (PLA/PETG): Заглушка для карниза и датчика умного дома. [Открыть модель](https://www.printables.com/model/298412-curtain-rail-plug-and-sensor-mount) | Полезная фурнитура?" 
              ;;
            5) 
              PHOTO_URL="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=1000"
              CAPTION="🌿 Эко-декор (PLA): Стильное кашпо со сложными гранями. [Открыть модель](https://www.printables.com/model/451234-low-poly-planter) | Пробуем эко-стиль?" 
              ;;
            6) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=1000"
              CAPTION="🛡 TPU: Виброизоляционные демпферы под ножки принтера. [Открыть модель](https://www.printables.com/model/324910-tpu-printer-feet-dampers) | Тестируем усадку на мягком?" 
              ;;
            7) 
              PHOTO_URL="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=1000"
              CAPTION="🧴 PETG/PLA: Сменная крышка-дозатор для диспенсера Sagrotan. [Открыть модель](https://www.printables.com/model/284102-sagrotan-dentol-nachfull-deckel) | Полезная бытовая мелочь?" 
              ;;
            8) 
              PHOTO_URL="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1000"
              CAPTION="🏢 PLA: Подставка-сердечко для чашек (Coaster). [Открыть модель](https://www.printables.com/model/394102-heart-coaster) | Отличный сувенир?" 
              ;;
            9) 
              PHOTO_URL="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1000"
              CAPTION="🚗 PETG: Автомобильный крючок-клипса для сумок в салон. [Открыть модель](https://www.printables.com/model/394819-car-headrest-hook) | Кому из водителей актуально?" 
              ;;
            10) 
              PHOTO_URL="https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1000"
              CAPTION="🌱 PLA/PETG: Настенный эргономичный держатель для роутера. [Открыть модель](https://www.printables.com/model/123984-wall-mount-router-holder) | Запустим серию?" 
              ;;
            11) 
              PHOTO_URL="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=1000"
              CAPTION="🍳 PETG: Подставка и организатор под крышки для кастрюль. [Открыть модель](https://www.printables.com/model/198273-pot-lid-holder) | Какую проблему кухни решим?" 
              ;;
            12) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=1000"
              CAPTION="🔧 PETG: Держатель под инструмент для перфопанели. [Открыть модель](https://www.printables.com/model/502819-pegboard-pliers-holder) | Переделываем стеллажи?" 
              ;;
            13) 
              PHOTO_URL="https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=1000"
              CAPTION="🐾 PLA: Двойная приподнятая миска для домашних животных. [Открыть модель](https://www.printables.com/model/284719-elevated-pet-bowl-stand) | У кого питомцы протестируют?" 
              ;;
            14) 
              PHOTO_URL="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=1000"
              CAPTION="🎁 PLA/PETG: Брендированная настольная подставка для визиток. [Открыть модель](https://www.printables.com/model/319402-business-card-holder) | Делаем под заказ?" 
              ;;
            15) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000"
              CAPTION="⚡ PETG: Угловые мебельные крепежи повышенной прочности. [Открыть модель](https://www.printables.com/model/419203-heavy-duty-corner-bracket) | Насколько востребовано?" 
              ;;
            16) 
              PHOTO_URL="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1000"
              CAPTION="💪 Бизнес-фокус: От хобби к цеху. Как нашей тройке превратить разовые заказы в поток серийного производства? Обсуждаем стратегию масштабирования!" 
              ;;
            17) 
              PHOTO_URL="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?w=1000"
              CAPTION="🎯 Инженерный рост: Каждая неудачная печать и отлипший слой — это не брак, а калибровка опыта. Какой сложный узел победим на этой неделе?" 
              ;;
            18) 
              PHOTO_URL="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1000"
              CAPTION="🤝 Синергия команды: Один моделирует, второй настраивает термопрофиль, третий закрывает сбыт. Как распределим задачи для следующего крупного проекта?" 
              ;;
          esac

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendPhoto" \
            -d "chat_id=$TELEGRAM_TO" \
            -d "photo=$PHOTO_URL" \
            -d "parse_mode=Markdown" \
            -d "caption=$CAPTION")

          echo "Telegram Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent to Telegram!"
          else
            echo "ERROR: Failed to send to Telegram!"
            exit 1
          fi
